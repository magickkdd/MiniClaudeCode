[project]
name = "mini-claude-code"
version = "0.1.0"
description = "A minimal Claude-Code-style coding agent, built to learn agent engineering."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# rich 只用于终端美化；缺失时渲染层自动退化成纯文本。核心功能不依赖它。
pretty = ["rich>=13.7"]
dev = ["pytest>=8.0", "rich>=13.7"]

[project.scripts]
mcc = "miniclaude.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniclaude"]

[tool.pytest.ini_options]
pythonpath = ["src", "demos"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
